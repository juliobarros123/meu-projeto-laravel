# .github/workflows/artifacts-test.yml
name: Teste de Artifacts

on:
  workflow_dispatch:  # Botão manual para testar

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build imagem de teste
        run: docker build --target test -t app:test .
      
      - name: Rodar testes e gerar cobertura
        run: |
              docker run --rm -e APP_KEY="base64:$(openssl rand -base64 32)" app:test php artisan test
              echo "<coverage><project/></coverage>" > coverage.xml
      
      - name: Upload do artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  ler:
    needs: gerar
    runs-on: ubuntu-latest
    steps:
      - name: Download do artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .
      
      - name: Ler o arquivo
        run: cat coverage.xml