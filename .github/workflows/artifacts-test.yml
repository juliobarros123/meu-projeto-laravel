# .github/workflows/artifacts-test.yml
name: Teste de Artifacts

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem de teste
        run: docker build --target test -t app:test .

      - name: Criar .env localmente
        run: |
          echo "APP_ENV=testing" > .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env

      - name: Rodar testes e gerar cobertura
        run: |
          docker run --rm \
            -e APP_ENV=testing \
            -e XDEBUG_MODE=coverage \
            -v "${{ github.workspace }}:/var/www" \
            app:test \
            php artisan test --coverage-clover=/var/www/output/coverage.xml

      - name: Criar diretório de saída
        run: mkdir -p output

      - name: Copiar coverage do container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/var/www" \
            app:test \
            bash -c "cp /var/www/output/coverage.xml /var/www/coverage.xml 2>/dev/null || echo 'Arquivo não encontrado'"

      - name: Upload do artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  ler:
    needs: gerar
    runs-on: ubuntu-latest
    steps:
      - name: Download do artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .
          if-no-files-found: warn

      - name: Ler o arquivo
        run: |
          if [ -f coverage.xml ]; then
            cat coverage.xml
          else
            echo "Arquivo coverage.xml não encontrado"
          fi