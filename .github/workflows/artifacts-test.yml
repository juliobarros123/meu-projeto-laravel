# .github/workflows/artifacts-test.yml
name: Teste de Artifacts

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem de teste
        run: docker build --target test -t app:test .

      - name: Rodar testes e gerar cobertura
        run: |
          docker run --rm \
            -e APP_ENV=testing \
            -e XDEBUG_MODE=coverage \
            -v "${{ github.workspace }}:/var/www/output" \
            app:test \
            bash -c "
              # Cria .env se não existir
              if [ ! -f .env ]; then
                if [ -f .env.example ]; then
                  cp .env.example .env
                else
                  echo 'APP_ENV=testing' > .env
                fi
              fi
              
              # Gera a APP_KEY
              php artisan key:generate --force
              
              # Roda os testes com coverage
              php artisan test --coverage-clover=/var/www/output/coverage.xml
            "

      - name: Upload do artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  ler:
    needs: gerar
    runs-on: ubuntu-latest
    steps:
      - name: Download do artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: Ler o arquivo
        run: cat coverage.xml