# .github/workflows/artifacts-test.yml
name: Teste de Artifacts

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem de teste
        run: docker build --target test -t app:test .

      - name: Rodar testes e gerar cobertura
        run: |
          # Executa os testes dentro do container
          docker run --rm \
            -e APP_ENV=testing \
            -e XDEBUG_MODE=coverage \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            --name test-runner \
            app:test \
            /bin/sh -c "
              # Configura ambiente
              echo 'APP_ENV=testing' > .env
              echo 'APP_KEY=$APP_KEY' >> .env
              echo 'DB_CONNECTION=sqlite' >> .env
              echo 'DB_DATABASE=:memory:' >> .env
              
              # Executa testes
              php artisan test --coverage-clover=/var/www/coverage.xml
            "
          
          # Copia o arquivo de cobertura (ignora erro se não existir)
          docker cp test-runner:/var/www/coverage.xml ./coverage.xml 2>/dev/null || echo "Arquivo não encontrado no container"

      - name: Verificar se coverage.xml foi gerado
        run: |
          if [ -f coverage.xml ]; then
            echo "✅ coverage.xml gerado com sucesso!"
            echo "Tamanho: $(wc -c < coverage.xml) bytes"
          else
            echo "⚠️ coverage.xml não encontrado"
          fi

      - name: Upload do artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  ler:
    needs: gerar
    runs-on: ubuntu-latest
    steps:
      - name: Download do artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .
          if-no-files-found: warn

      - name: Ler o arquivo
        run: |
          if [ -f coverage.xml ]; then
            echo "📊 Conteúdo do coverage.xml:"
            cat coverage.xml
          else
            echo "⚠️ Arquivo coverage.xml não encontrado"
          fi