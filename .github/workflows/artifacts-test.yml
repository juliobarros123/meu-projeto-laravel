# .github/workflows/artifacts-test.yml
name: Teste de Artifacts

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem de teste
        run: docker build --target test -t app:test .

      - name: Rodar testes e gerar cobertura
        run: |
          # Gera APP_KEY
          APP_KEY="base64:$(openssl rand -base64 32)"
          
          # Executa os testes dentro do container
          docker run --rm \
            -e APP_ENV=testing \
            -e XDEBUG_MODE=coverage \
            -e APP_KEY="$APP_KEY" \
            -v "${{ github.workspace }}:/app-output" \
            app:test \
            /bin/sh -c "
              echo 'APP_ENV=testing' > .env
              echo 'APP_KEY=$APP_KEY' >> .env
              echo 'DB_CONNECTION=sqlite' >> .env
              echo 'DB_DATABASE=:memory:' >> .env
              
              php artisan test --coverage-clover=/app-output/coverage.xml
            " || echo "Testes executados com warnings"
          
          # Verifica se o arquivo foi gerado
          if [ -f coverage.xml ]; then
            echo "✅ coverage.xml gerado com sucesso!"
            echo "Tamanho: $(wc -c < coverage.xml) bytes"
          else
            echo "⚠️ coverage.xml não encontrado"
            # Cria um arquivo vazio para não quebrar o workflow
            echo '<?xml version="1.0"?><coverage></coverage>' > coverage.xml
          fi

      - name: Upload do artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  ler:
    needs: gerar
    runs-on: ubuntu-latest
    steps:
      - name: Download do artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: Ler o arquivo
        run: |
          if [ -f coverage.xml ]; then
            echo "📊 Conteúdo do coverage.xml:"
            cat coverage.xml
          else
            echo "⚠️ Arquivo coverage.xml não encontrado"
            exit 1
          fi