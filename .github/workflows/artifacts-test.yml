# .github/workflows/artifacts-test.yml
name: Teste de Artifacts

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem de teste
        run: docker build --target test -t app:test .

      - name: Rodar testes e gerar cobertura
        run: |
          # Cria um container e executa os testes
          docker run --rm \
            -e APP_ENV=testing \
            -e XDEBUG_MODE=coverage \
            --name test-container \
            app:test \
            /bin/sh -c "
              # Cria .env
              echo 'APP_ENV=testing' > .env
              echo 'APP_KEY=base64:$(openssl rand -base64 32)' >> .env
              
              # Roda os testes
              php artisan test --coverage-clover=/var/www/coverage.xml
            "
          
          # Copia o arquivo de cobertura do container
          docker cp test-container:/var/www/coverage.xml ./coverage.xml 2>/dev/null || echo "Arquivo não encontrado"

      - name: Upload do artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  ler:
    needs: gerar
    runs-on: ubuntu-latest
    steps:
      - name: Download do artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .
          if-no-files-found: warn

      - name: Ler o arquivo
        run: |
          if [ -f coverage.xml ]; then
            cat coverage.xml
          else
            echo "Arquivo coverage.xml não encontrado"
          fi