name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t laravel-app:test .

      - name: Run tests with Docker Compose
        run: |
          docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from app

      - name: Lint (opcional - Laravel Pint)
        run: |
          docker run --rm laravel-app:test ./vendor/bin/pint --test || true

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
    steps:
      - name: Login no registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ...
      - name: Gerar Versão
        id: version
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Usar a versão gerada
        run: echo "A tag é ${{ steps.version.outputs.tag }}" 
