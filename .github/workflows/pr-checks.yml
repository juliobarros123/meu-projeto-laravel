# .github/workflows/pr-checks.yml
name: Build, Test & Deploy

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build imagem de teste
        run: docker build --target test -t app:test .
      
      - name: Rodar testes
        run: docker run --rm -e APP_KEY="base64:$(openssl rand -base64 32)" app:test php artisan test

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      APP_ENV: production              # ← env: disponível em todos os steps

    steps:
      - uses: actions/checkout@v4
      
      - name: Login no registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        # ↑ secrets.REGISTRY_TOKEN (configurado no GitHub)
      
      - name: Gerar versão
        id: version                     # ← id para referenciar
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        # ↑ escreve no GITHUB_OUTPUT
      
      - name: Buildar e taguear com a versão gerada
        run: docker build -t ghcr.io/org/app:${{ steps.version.outputs.tag }} .
        # ↑ usa steps.version.outputs.tag