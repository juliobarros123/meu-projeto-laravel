# .github/workflows/pr-checks.yml
name: Build, Test & Deploy 
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build imagem de teste
        run: docker build --target test -t app:test .
      - name: Rodar testes
        run: docker run --rm -e APP_KEY="base64:$(openssl rand -base64 32)" app:test php artisan test
      - name: Lint (Laravel Pint)
        run: docker run --rm app:test ./vendor/bin/pint --test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build imagem de produção
        run: docker build --target production -t app:production .
 