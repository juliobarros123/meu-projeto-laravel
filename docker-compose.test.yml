services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-test
    environment:
      - APP_ENV=testing
      - APP_KEY=base64:3a4b5c6d7e8f9g0h1i2j3k4l5m6n7o8p=
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=laravel_test
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan test

  mysql:
    image: mysql:8.0
    container_name: mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10